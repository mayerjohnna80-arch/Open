<svg width="240" height="64" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OPEN logo">
  <defs>
    <linearGradient id="openGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7802E"/>
      <stop offset="1" stop-color="#8B4CF0"/>
